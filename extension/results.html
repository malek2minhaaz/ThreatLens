<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ThreatLens Scan Report</title>
<style>
  :root {
    --bg: #0b1220; --panel: #101a2e; --border: rgba(148,163,184,0.18);
    --text: #e2e8f0; --dim: #94a3b8; --mute: #64748b;
    --cyan: #22d3ee; --safe: #34d399; --low: #a3e635; --suspicious: #fbbf24; --danger: #f87171; --violet: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 34px 18px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-weight: 700; }
  .brand span { color: var(--cyan); }
  .brand .tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid rgba(34,211,238,0.4); border-radius: 999px; padding: 2px 8px; margin-left: 8px;
  }
  .hero {
    display: flex; align-items: center; gap: 26px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 26px; margin-bottom: 20px;
  }
  .ring {
    width: 132px; height: 132px; border-radius: 50%; flex-shrink: 0; display: grid;
    place-items: center; position: relative; background: conic-gradient(var(--safe) 0deg, rgba(148,163,184,0.15) 0deg);
  }
  .ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--panel); }
  .ring__val { position: relative; z-index: 1; font-weight: 700; font-size: 38px; font-family: "Space Grotesk", sans-serif; }
  .hero__info { min-width: 0; }
  .verdict {
    display: inline-block; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    font-size: 12px; padding: 6px 15px; border-radius: 999px; border: 1px solid; margin-bottom: 10px;
  }
  .verdict.v-safe { color: var(--safe); border-color: rgba(52,211,153,0.45); background: rgba(52,211,153,0.1); }
  .verdict.v-low { color: var(--low); border-color: rgba(163,230,53,0.45); background: rgba(163,230,53,0.1); }
  .verdict.v-suspicious { color: var(--suspicious); border-color: rgba(251,191,36,0.45); background: rgba(251,191,36,0.1); }
  .verdict.v-danger { color: var(--danger); border-color: rgba(248,113,113,0.5); background: rgba(248,113,113,0.12); }
  .url { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; word-break: break-all; }
  .meta { font-family: "Cascadia Code", Consolas, monospace; font-size: 11.5px; color: var(--mute); margin-top: 5px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); margin-bottom: 14px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .cat { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .cat__name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mute); }
  .cat__pts { font-weight: 700; font-size: 20px; font-family: "Space Grotesk", sans-serif; margin-top: 2px; }
  .cat__pts.pos { color: var(--safe); }
  .cat__pts.neg { color: var(--danger); }
  .findings { display: flex; flex-direction: column; gap: 8px; }
  .finding {
    display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start;
    background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--mute);
    border-radius: 9px; padding: 9px 11px;
  }
  .finding.f-critical { border-left-color: var(--danger); }
  .finding.f-high { border-left-color: var(--suspicious); }
  .finding.f-medium { border-left-color: var(--cyan); }
  .finding.f-low { border-left-color: var(--dim); }
  .finding.f-info { border-left-color: var(--violet); }
  .finding.f-positive { border-left-color: var(--safe); }
  .f-pts { font-weight: 700; text-align: center; background: rgba(148,163,184,0.12); border-radius: 7px; padding: 5px 0; }
  .f-pts.pos { color: var(--safe); }
  .f-pts.neg { color: var(--danger); }
  .f-title { font-weight: 600; font-size: 13px; }
  .f-detail { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .empty { color: var(--mute); font-size: 13px; }
  .status { color: var(--dim); margin: 18px 0; font-size: 13px; }
  .status.error { color: var(--danger); }
  .link-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  a.btn {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: 13px;
    padding: 10px 16px; border-radius: 9px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); transition: border-color .2s, color .2s;
  }
  a.btn:hover { color: var(--cyan); border-color: rgba(34,211,238,0.5); }
  a.btn.primary { background: linear-gradient(135deg, #22d3ee, #0ea5e9 60%, #a78bfa); color: #04121a; border: none; }
  pre.raw { background: #070b14; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 11px; line-height: 1.5; max-height: 380px; overflow: auto; white-space: pre-wrap; word-break: break-word; color: #34d399; font-family: "Cascadia Code", Consolas, monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <span class="brand">🛡️ Threat<span>Lens</span><span class="tag">scan report</span></span>
    </div>

    <div id="loading" class="status">Scanning…</div>
    <div id="error" class="status error" hidden></div>

    <div id="report" hidden>
      <div class="hero">
        <div class="ring" id="scoreRing"><span class="ring__val" id="scoreValue">—</span></div>
        <div class="hero__info">
          <div><span class="verdict" id="verdict">—</span></div>
          <div class="url" id="scanUrl"></div>
          <div class="meta" id="scanMeta"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Category totals</h2>
        <div class="cats" id="cats"></div>
      </div>

      <div class="panel">
        <h2>Findings</h2>
        <div class="findings" id="findings"></div>
      </div>

      <div class="link-row">
        <a class="btn primary" id="openDashboard" href="#" target="_blank">Open in dashboard →</a>
        <a class="btn" id="rescan" href="#">Rescan</a>
        <a class="btn" id="toggleRaw" href="#">Show raw JSON</a>
      </div>

      <pre class="raw" id="raw" hidden></pre>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="results.js"></script>
</body>
</html>
