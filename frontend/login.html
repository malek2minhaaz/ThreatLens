<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · ThreatLens</title>
  <meta name="description" content="Sign in to ThreatLens to scan URLs and analyze phishing content." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("threatlens_theme") || "light";</script>
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <!-- Ambient background -->
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas class="neon-maze" aria-hidden="true"></canvas>
  <div class="bg-glow bg-glow--cyan" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--magenta" aria-hidden="true"></div>
  <div class="prism-grid" aria-hidden="true" data-rotate-x="10" data-rotate-y="-8" data-sway="4"></div>

  <main>
    <section class="page auth-wrap">
      <div class="auth-card panel">
        <div class="auth-card__brand">
          <span class="brand__shield" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5l8-3z"/>
              <path d="M9 12l2 2 4-4"/>
            </svg>
          </span>
          <h1 class="auth-card__title">Welcome back</h1>
          <p class="auth-card__sub">Sign in to scan URLs and analyze phishing content.</p>
        </div>
        <form id="loginForm" class="form" autocomplete="on">
          <div class="field">
            <label class="field-label" for="loginIdentifier">Username or email</label>
            <input id="loginIdentifier" class="input" type="text" placeholder="alex / alex@mail.com" autocomplete="username" required />
          </div>
          <div class="field">
            <label class="field-label" for="loginPassword">Password</label>
            <input id="loginPassword" class="input" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button class="btn btn--primary btn--block" type="submit" id="loginBtn">
            <span class="btn__label">Sign In</span>
            <span class="btn__spinner" aria-hidden="true"></span>
          </button>
        </form>
        <p class="auth-card__switch">New to ThreatLens? <a href="register.html">Create an account</a></p>
      </div>
    </section>
  </main>

  <script src="/static/js/app.js?v=4" defer></script>
  <script src="/static/js/backgrounds.js?v=4" defer></script>
  <script src="/static/js/pages/auth.js?v=4" defer></script>
</body>
</html>
